# Embedded filesystem mount-option registry for dotdrift generate.
#
# Presets derive from the reference script (pimp-my-cachyos
# mise-tasks/system/mountpoints.sh). The bare tokens "uid" and "gid" are
# placeholders: renderers substitute the invoking user's uid/gid
# (uid=<n>, gid=<n>) at render time.
#
# Schema per [filesystems.<type>] entry:
#   kind           "volume" | "network"                    (required)
#   family         groups alternatives (e.g. "ntfs" for ntfs3/ntfs-3g);
#                  the family is also what the rendered .mount unit's
#                  Type= announces (ntfs3/ntfs-3g both mount as "ntfs" —
#                  the kernel/mount helper picks the driver, so the unit
#                  names the generic type); empty means the type is its
#                  own family                              (optional)
#   options        mount-option preset                     (required)
#   after          systemd unit dependencies               (optional)
#   recommended_if only "kernel <op> <version>"            (optional)
#   packages       distro packages the type needs          (required)
#   absent         distro packages to remove when used     (optional)

[filesystems.default]
kind = "volume"
options = ["auto", "rw", "relatime"]

[filesystems.btrfs]
kind = "volume"
options = ["auto", "rw", "relatime"]

[filesystems.exfat]
kind = "volume"
options = ["auto", "rw", "uid", "gid", "dmask=027", "fmask=027", "noatime"]

[filesystems.vfat]
kind = "volume"
options = ["auto", "rw", "uid", "gid", "dmask=027", "fmask=027", "noatime"]

[filesystems.ntfs3]
kind = "volume"
family = "ntfs"
options = ["auto", "rw", "uid", "gid", "dmask=027", "fmask=027", "dev", "exec", "noatime", "iocharset=utf8", "windows_names", "suid", "discard"]
recommended_if = "kernel >= 7.1"
packages = ["ntfsprogs-plus"]
absent = ["ntfs-3g"]

[filesystems.ntfs-3g]
kind = "volume"
family = "ntfs"
options = ["auto", "rw", "uid", "gid", "dmask=027", "fmask=027", "dev", "exec", "noatime", "iocharset=utf8", "windows_names", "big_writes", "suid"]
recommended_if = "kernel < 7.1"
packages = ["ntfs-3g"]

[filesystems.nfs]
kind = "network"
options = ["rw", "nosuid", "soft", "nfsvers=4", "noacl", "async", "nocto", "nconnect=16", "_netdev", "timeo=3", "retrans=2", "bg"]
after = ["network.target", "local-fs.target"]
packages = ["nfs-utils", "nfsidmap"]

# Sensible defaults; the reference script has no cifs preset.
[filesystems.cifs]
kind = "network"
options = ["rw", "nosuid", "soft", "vers=3.0", "_netdev", "noacl"]
packages = ["cifs-utils"]
