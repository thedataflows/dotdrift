<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dotdrift Apply Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 42rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    .colophon {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      color: var(--color-soft);
      border-top: 1px solid rgba(45,49,66,0.12);
      margin-top: 1.25rem;
      padding-top: 0.75rem;
    }
    .colophon a { color: var(--color-soft); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Apply Pipeline</h1>
    <p class="subtitle">Eight ordered steps. The state cursor is checkpointed after each step, so an interrupted apply resumes exactly where it stopped.</p>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apply-pipeline-title apply-pipeline-desc">
      <title id="apply-pipeline-title">dotdrift apply pipeline</title>
      <desc id="apply-pipeline-desc">The eight-step apply pipeline in order, with the state cursor checkpointed after each step so an interrupted run resumes where it stopped.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- preamble tag -->
      <text x="480" y="32" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">PREAMBLE · LOCK STATE · LOAD CURSOR · WRITE MISE CONFIGS</text>
      <text x="480" y="44" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">STEPS RUN IN ORDER · CURSOR SAVED AFTER EACH</text>

      <!-- connectors (drawn before boxes) -->
      <line x1="480" y1="104" x2="480" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="480" y1="176" x2="480" y2="192" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="480" y1="248" x2="480" y2="264" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="480" y1="320" x2="480" y2="336" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="480" y1="392" x2="480" y2="408" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="480" y1="464" x2="480" y2="476" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="480" y1="532" x2="480" y2="544" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- checkpoint: trunk to state (dashed) -->
      <path d="M 620 292 H 744 Q 752 292 752 300 V 316 Q 752 324 760 324 H 840" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="648" y="268" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="276" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECKPOINT</text>

      <!-- resume: state back to first step (accent) -->
      <path d="M 960 284 V 84 Q 960 76 952 76 H 620" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="756" y="52" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="786" y="60" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESUME</text>

      <!-- callout -->
      <text x="1240" y="112" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">An interrupted apply re-enters the pipeline</text>
      <text x="1240" y="132" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">after the last saved cursor — stale cursors run from scratch.</text>
      <path d="M 1004 140 Q 1052 208 1064 280" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="1064" cy="280" r="2" fill="#2d3142"/>

      <!-- pipeline steps -->
      <rect x="312" y="68" width="16" height="16" rx="4" fill="rgba(45,49,66,0.08)"/>
      <text x="320" y="80" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="340" y="48" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="48" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hooks-pre</text>
      <text x="480" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mise run hooks-pre</text>

      <rect x="312" y="140" width="16" height="16" rx="4" fill="rgba(45,49,66,0.08)"/>
      <text x="320" y="152" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <rect x="340" y="120" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="120" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">packages</text>
      <text x="480" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mise bootstrap · paru plugin</text>

      <rect x="312" y="212" width="16" height="16" rx="4" fill="rgba(45,49,66,0.08)"/>
      <text x="320" y="224" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <rect x="340" y="192" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="192" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tools</text>
      <text x="480" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mise install</text>

      <rect x="312" y="284" width="16" height="16" rx="4" fill="rgba(45,49,66,0.08)"/>
      <text x="320" y="296" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <rect x="340" y="264" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="264" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dotfiles</text>
      <text x="480" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mise dotfiles apply · user scope</text>

      <rect x="312" y="356" width="16" height="16" rx="4" fill="rgba(45,49,66,0.08)"/>
      <text x="320" y="368" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5</text>
      <rect x="340" y="336" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="336" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dotfiles-system</text>
      <text x="480" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">system scope · sudo when not writable</text>

      <rect x="312" y="428" width="16" height="16" rx="4" fill="rgba(45,49,66,0.08)"/>
      <text x="320" y="440" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>
      <rect x="340" y="408" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="408" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mounts</text>
      <text x="480" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mise bootstrap · services</text>

      <rect x="312" y="496" width="16" height="16" rx="4" fill="rgba(45,49,66,0.08)"/>
      <text x="320" y="508" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">7</text>
      <rect x="340" y="476" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="476" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">smb</text>
      <text x="480" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mise bootstrap · testparm · smbpasswd</text>

      <rect x="312" y="564" width="16" height="16" rx="4" fill="rgba(45,49,66,0.08)"/>
      <text x="320" y="576" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">8</text>
      <rect x="340" y="544" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="544" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="568" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hooks-post</text>
      <text x="480" y="584" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mise run hooks-post</text>

      <!-- focal: state cursor -->
      <rect x="840" y="284" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="284" width="240" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="960" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">resume cursor</text>
      <text x="960" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">last completed step · state file + lock</text>
      <text x="960" y="344" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">removed on clean finish</text>

      <!-- legend strip -->
      <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="48" y="684" width="16" height="16" rx="4" fill="rgba(45,49,66,0.08)"/>
      <text x="56" y="696" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="72" y="684" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="108" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">pipeline step</text>
      <rect x="216" y="684" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="248" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">focal · state</text>
      <line x1="360" y1="692" x2="400" y2="692" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="412" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">save cursor after each step</text>
      <line x1="584" y1="692" x2="624" y2="692" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="636" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">resume skips completed</text>
    </svg>

    <p class="colophon">dotdrift · docs/diagrams · figure 2 of 2 — routing context: <a href="command-flow.html">command-flow.html</a> · generated with diagram-design</p>
  </div>
</body>
