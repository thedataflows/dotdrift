<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dotdrift Command Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-soft:    #7a8399;
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 42rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }

    .colophon {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.06em;
      color: var(--color-soft);
      border-top: 1px solid rgba(45,49,66,0.12);
      margin-top: 1.25rem;
      padding-top: 0.75rem;
    }
    .colophon a { color: var(--color-soft); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Command Flow</h1>
    <p class="subtitle">One resolve chain feeds every profile command. Only apply acts on the resolved plan — everything else renders it.</p>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="command-flow-title command-flow-desc">
      <title id="command-flow-title">dotdrift command flow</title>
      <desc id="command-flow-desc">How a CLI invocation routes through kong parsing to the shared detect, load, and resolve chain, with read-only, authoring, and apply branches.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- connectors (drawn before boxes) -->
      <line x1="640" y1="108" x2="640" y2="152" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="540" y1="196" x2="380" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="740" y1="196" x2="896" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="640" y1="240" x2="640" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="640" y1="336" x2="640" y2="372" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="640" y1="428" x2="640" y2="464" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="640" y1="536" x2="384" y2="536" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="640" y1="520" x2="640" y2="556" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <circle cx="640" cy="536" r="4" fill="#2d3142"/>

      <!-- arrow labels (masked, off-stroke) -->
      <rect x="428" y="176" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="184" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO PROFILE</text>
      <rect x="792" y="176" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="184" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTHOR</text>
      <rect x="648" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="672" y="260" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROFILE</text>
      <rect x="400" y="516" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="432" y="524" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text>
      <rect x="648" y="528" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="536" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPLY</text>

      <!-- start (ellipse) -->
      <ellipse cx="640" cy="84" rx="120" ry="24" fill="#f5f5f5"/>
      <ellipse cx="640" cy="84" rx="120" ry="24" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="640" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dotdrift &lt;cmd&gt;</text>
      <text x="640" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kong parse · dotenv · log setup</text>

      <!-- decision (diamond) -->
      <polygon points="640,152 740,196 640,240 540,196" fill="#f5f5f5"/>
      <polygon points="640,152 740,196 640,240 540,196" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">route by cmd</text>

      <!-- leaf: no-profile commands -->
      <rect x="148" y="164" width="232" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="148" y="164" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">detect · version · paru</text>
      <text x="264" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no profile needed</text>

      <!-- leaf: authoring commands -->
      <rect x="896" y="164" width="272" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="896" y="164" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1032" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">authoring</text>
      <text x="1032" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">init · generate · onboard · restore</text>
      <text x="1032" y="216" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">init creates; the rest write into one</text>

      <!-- shared resolve chain -->
      <rect x="500" y="280" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="280" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">detect.Detect → Facts</text>
      <text x="640" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">host · user · os · kernel · gpu · backend</text>

      <rect x="500" y="372" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="372" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">profile.Load</text>
      <text x="640" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">config union · discover · when-select</text>

      <rect x="500" y="464" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="464" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">resolve.Resolve</text>
      <text x="640" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merge base &lt; host &lt; user → Plan</text>

      <!-- read-only consumers of the plan -->
      <rect x="144" y="500" width="240" height="76" rx="6" fill="#f5f5f5"/>
      <rect x="144" y="500" width="240" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="264" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">plan · status · modules</text>
      <text x="264" y="544" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">render the resolved plan</text>
      <text x="264" y="560" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read-only · exit 0</text>

      <!-- focal: apply -->
      <rect x="500" y="556" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="556" width="280" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="640" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">apply · pipeline</text>
      <text x="640" y="596" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8 steps · state cursor · see apply-pipeline.html</text>

      <!-- legend strip -->
      <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <ellipse cx="60" cy="692" rx="14" ry="8" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="84" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">start / end</text>
      <polygon points="176,684 188,692 176,700 164,692" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">decision</text>
      <rect x="292" y="684" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="324" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">step</text>
      <rect x="408" y="684" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="440" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">focal</text>
      <circle cx="536" cy="692" r="4" fill="#2d3142"/>
      <text x="552" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">branch tap</text>
    </svg>

    <p class="colophon">dotdrift · docs/diagrams · figure 1 of 2 — pipeline detail: <a href="apply-pipeline.html">apply-pipeline.html</a> · generated with diagram-design</p>
  </div>
</body>
</html>
